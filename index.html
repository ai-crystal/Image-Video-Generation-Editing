<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图像生成与编辑技术 · Dr. Dezeming</title>
  <meta name="description" content="从变分自编码器到扩散模型、流匹配与图像编辑的系统教程">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root { --theme-color: #2f5d8a; }
    .sidebar { width: 300px; }
    .content { max-width: 900px; }
    .markdown-section { font-size: 16px; line-height: 1.85; }
    .markdown-section h1 { font-size: 1.9em; }
    .markdown-section img { max-width: 100%; border-radius: 2px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section p { text-align: justify; }
    .cover-main h1 { font-size: 2.4em; }
    .app-nav { margin-right: 20px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '图像生成与编辑技术',
      repo: '',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      coverpage: true,
      subMaxLevel: 2,
      maxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        placeholder: '搜索',
        noData: '没有找到结果',
        depth: 3
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.renderMathInElement) {
              window.renderMathInElement(document.querySelector('.markdown-section'), {
                delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
                ],
                throwOnError: false
              });
            }
            if (window.mermaid) {
              try { window.mermaid.init(undefined, document.querySelectorAll('.language-mermaid')); } catch (e) {}
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    }
  </script>
</body>
</html>
